name: Cleanup runs & releases

# 在 Actions 页面点 "Run workflow" 就跑，不需要本地装任何东西。
# 用的是内置 GITHUB_TOKEN（下面的 permissions 已经给足），不用配 PAT。
#
# 建议顺序：先 dry_run=true 点一次看数量，确认无误再关掉 dry_run 并填 confirm=DELETE。

on:
  workflow_dispatch:
    inputs:
      keep_runs:
        description: '保留最近多少次运行（0 = 全删，本次运行的记录永远保留）'
        required: true
        default: '0'
        type: string
      keep_releases:
        description: '保留最近多少个 Release（0 = 全删）'
        required: true
        default: '0'
        type: string
      delete_releases:
        description: '删除 Releases（连带附件和 tag）'
        type: boolean
        default: true
      delete_runs:
        description: '删除 Actions 运行记录（连带 artifact 和日志）'
        type: boolean
        default: true
      delete_artifacts:
        description: '清理残留的 artifact'
        type: boolean
        default: true
      purge_tags:
        description: '连没有挂 Release 的孤儿 tag 也一起删'
        type: boolean
        default: false
      dry_run:
        description: '只预览、不真删'
        type: boolean
        default: true
      confirm:
        description: '真删时在这里输入 DELETE（dry_run=true 时忽略）'
        required: false
        default: ''
        type: string

permissions:
  actions: write     # 删 workflow run / artifact
  contents: write    # 删 release / tag

concurrency:
  group: cleanup-runs-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: 参数与二次确认
        env:
          DRY: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          echo "仓库        : $REPO"
          echo "本次运行 id : $GITHUB_RUN_ID"
          echo "dry_run     : $DRY"
          echo "keep_runs   : ${{ inputs.keep_runs }}"
          echo "keep_rel    : ${{ inputs.keep_releases }}"
          echo "删 release  : ${{ inputs.delete_releases }}"
          echo "删 run      : ${{ inputs.delete_runs }}"
          echo "删 artifact : ${{ inputs.delete_artifacts }}"
          echo "孤儿 tag    : ${{ inputs.purge_tags }}"

          if [ "$DRY" != "true" ] && [ "$CONFIRM" != "DELETE" ]; then
            echo "::error::真删需要在 confirm 输入框里填 DELETE（当前是 '$CONFIRM'）。先用 dry_run=true 预览一次。"
            exit 1
          fi

          # keep_* 只接受非负整数，写错了按 0（全删）处理，别让算术直接炸
          for v in "${{ inputs.keep_runs }}" "${{ inputs.keep_releases }}"; do
            case "$v" in
              ''|*[!0-9]*) echo "::error::keep_runs / keep_releases 只能是数字，收到的是 '$v'"; exit 1 ;;
            esac
          done

          # 先确认 token 确实能用、权限对
          gh api "repos/$REPO" --jq '"仓库 ok: \(.full_name)  private=\(.private)"'
          echo "token 权限检查（有没有 actions/contents 的写权限）——"
          gh api "repos/$REPO" --jq '.permissions' || true

      - name: 删除 Releases
        if: ${{ inputs.delete_releases }}
        env:
          KEEP: ${{ inputs.keep_releases }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # API 默认按 published_at 倒序返回，正好是「最新的在前面」
          mapfile -t rows < <(
            gh api --paginate "repos/$REPO/releases?per_page=100" \
              --jq '.[] | [ (.published_at // .created_at), (.id|tostring), .tag_name ] | @tsv'
          )
          total=${#rows[@]}
          echo "共 $total 个 Release，保留最近 $KEEP 个"

          n=0
          for ((i=KEEP; i<total; i++)); do
            IFS=$'\t' read -r ts id tag <<< "${rows[$i]}"
            if [ "$DRY" = "true" ]; then
              echo "  [预览] $tag（$ts）"
              continue
            fi
            if gh api -X DELETE "repos/$REPO/releases/$id" >/dev/null 2>&1; then
              echo "  [ok] release $tag"
              # release 删了 tag 还在，顺手把 tag 也删掉（删不掉不算错）
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" >/dev/null 2>&1 \
                && echo "       tag $tag 已删" || echo "       tag $tag 删失败或不存在（跳过）"
              n=$((n + 1))
            else
              echo "::warning::删不掉 release $tag"
            fi
          done
          echo "Release 处理完：$n 个"

      - name: 删除孤儿 tag
        if: ${{ inputs.purge_tags }}
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name')
          echo "共 ${#tags[@]} 个 tag"
          for t in "${tags[@]}"; do
            if [ "$DRY" = "true" ]; then echo "  [预览] tag $t"; continue; fi
            gh api -X DELETE "repos/$REPO/git/refs/tags/$t" >/dev/null 2>&1 \
              && echo "  [ok] tag $t" || echo "  [跳过] tag $t（删不掉，可能被保护）"
          done

      - name: 删除运行记录
        if: ${{ inputs.delete_runs }}
        env:
          KEEP: ${{ inputs.keep_runs }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          mapfile -t ids < <(
            gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | (.id|tostring)'
          )
          total=${#ids[@]}
          echo "共 $total 条运行记录，保留最近 $KEEP 条（本次运行 $GITHUB_RUN_ID 永远跳过）"

          n=0
          skip=0
          for ((i=0; i<total; i++)); do
            id=${ids[$i]}
            # 不能删自己：删了正在跑的 run，这个 job 会被当场干掉
            if [ "$id" = "$GITHUB_RUN_ID" ]; then continue; fi
            if [ "$i" -lt "$KEEP" ]; then continue; fi
            if [ "$DRY" = "true" ]; then
              echo "  [预览] run $id"
              continue
            fi
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1; then
              n=$((n + 1))
              if [ $((n % 20)) -eq 0 ]; then echo "  已删 $n 条…"; fi
            else
              skip=$((skip + 1))
              echo "::warning::删不掉 run $id（还在跑？先 cancel）"
            fi
          done
          echo "运行记录处理完：删了 $n 条，失败 $skip 条"

      - name: 清理残留 artifact
        if: ${{ inputs.delete_artifacts }}
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mapfile -t arts < <(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.id) \(.name)"')
          echo "剩余 artifact：${#arts[@]} 个"
          for row in "${arts[@]}"; do
            id=${row%% *}
            name=${row#* }
            if [ "$DRY" = "true" ]; then echo "  [预览] artifact $name"; continue; fi
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1 \
              && echo "  [ok] artifact $name" || echo "  [跳过] artifact $name"
          done

      - name: 汇总
        if: always()
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          left_runs=$(gh api "repos/$REPO/actions/runs?per_page=1" --jq '.total_count' 2>/dev/null || echo '?')
          left_rel=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].id' 2>/dev/null | wc -l)
          left_tags=$(gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name' 2>/dev/null | wc -l)
          left_arts=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null | wc -l)
          {
            echo "## 清理结果"
            echo ""
            echo "| 项目 | 剩余 |"
            echo "| --- | --- |"
            echo "| 运行记录 | $left_runs |"
            echo "| Releases | $left_rel |"
            echo "| Tags | $left_tags |"
            echo "| Artifacts | $left_arts |"
            echo ""
            if [ "$DRY" = "true" ]; then
              echo "> 这次是 **预览**，什么都没删。确认数量无误后，把 dry_run 设为 false 并在 confirm 填 \`DELETE\`。"
            else
              echo "> 已完成实际删除。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
