name: _Build IPQ6000 NSS (reusable)

# 这是被 build-wifi.yml / build-nowifi.yml 调用的可复用工作流，不要直接运行。
# 两个版本共用它，差异只靠输入参数 variant 决定，避免两份 400 行 YAML 各改一半。

on:
  workflow_call:
    inputs:
      variant:
        description: '变体：wifi 或 nowifi'
        required: true
        type: string
      source_repo:
        required: false
        type: string
        default: 'https://github.com/LiBwrt/LibWrt.git'
      source_branch:
        required: false
        type: string
        default: '25.12-nss'
      extra_packages:
        required: false
        type: string
        default: ''
      enable_thirdparty:
        required: false
        type: string
        default: 'yes'
      strict_thirdparty:
        description: '第三方插件缺失时是否直接失败（yes=配置阶段就停，省掉 2~3 小时空跑）'
        required: false
        type: string
        default: 'yes'
      enable_docker:
        description: 'Docker：auto=按机型类（emmc 带 / nand 不带），yes=强制带，no=强制不带'
        required: false
        type: string
        default: 'auto'
      device_class:
        description: '机型类：all=nand+emmc 两个 job 并行，nand=AX5/ZN-M2，emmc=AX5 JDC/NN6000 v2'
        required: false
        type: string
        default: 'all'
      publish_release:
        required: false
        type: string
        default: 'yes'

permissions:
  contents: write

env:
  SOURCE_DIR: openwrt
  # 机型不再写死在这里：由 plan 依据 device_class 算成 matrix，每个 job 只编自己那批
  # 固件产物目录（相对源码根目录）
  BIN_DIR: bin/targets/qualcommax/ipq60xx

defaults:
  run:
    shell: bash

jobs:
  # 先算矩阵：一次编译只编一个类，两类各跑一个 job（互不阻塞，也避开 6 小时上限）
  plan:
    name: 规划机型矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 计算 matrix
        id: plan
        run: |
          set -euo pipefail
          cls="${{ inputs.device_class }}"
          # nand：128MB flash，docker 放不下 → 不带
          # emmc：eMMC，空间够 → 默认带 docker
          nand='{"class":"nand","devices":"redmi_ax5 zn_m2","docker":"no"}'
          emmc='{"class":"emmc","devices":"redmi_ax5-jdcloud link_nn6000-v2","docker":"yes"}'
          case "$cls" in
            all)  m="{\"include\":[$nand,$emmc]}" ;;
            nand) m="{\"include\":[$nand]}" ;;
            emmc) m="{\"include\":[$emmc]}" ;;
            *) echo "::error::device_class 只能是 all / nand / emmc，收到 '$cls'"; exit 1 ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "机型矩阵: $m"

  build:
    name: ${{ inputs.variant }} / ${{ matrix.class }} / NSS
    needs: plan
    runs-on: ubuntu-24.04
    # 加了 sing-box(Go) + HomeProxy + DiskMan 之后编译时间明显变长，
    # GitHub 单个 job 上限是 360 分钟，这里顶格
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VARIANT: ${{ inputs.variant }}
      DEVICES: ${{ matrix.devices }}
      ENABLE_THIRD_PARTY: ${{ inputs.enable_thirdparty }}
      STRICT_THIRD_PARTY: ${{ inputs.strict_thirdparty }}
      # auto 时按机型类决定（nand 不带、emmc 带），显式 yes/no 时以用户为准
      ENABLE_DOCKER: ${{ inputs.enable_docker == 'auto' && matrix.docker || inputs.enable_docker }}
      # 镜像体积提醒阈值（collect-firmware.sh 读这个变量）：
      # nand 机 128MB flash，超过 70MB 基本刷不进去；emmc 机带 docker，200MB 以内都正常
      IMAGE_WARN_MB: ${{ matrix.class == 'nand' && '70' || '200' }}

    steps:
      - name: 检出工作流仓库
        uses: actions/checkout@v4

      - name: 校验脚本完整性
        run: |
          set -euo pipefail
          # 按「内容指纹」判断，而不是看 @id 那行注释：
          #   - 只有关键代码缺失（= 文件被弄混/贴错/版本差太多）才失败；
          #   - 仅仅少一行 @id（内容其实是对的旧版）只给提示，不挡编译。
          echo "===== scripts/ 概览 ====="
          for f in scripts/*.sh; do
            printf '%5s 行  %-28s  %s\n' "$(wc -l < "$f" | tr -d ' ')" "$f" "$(sed -n '2p' "$f")"
          done
          echo

          fail=0
          check_script() {
            f="$1"; fp="$2"
            if [ ! -f "$f" ]; then
              echo "::error::缺少脚本 $f"
              fail=1
              return
            fi
            if ! grep -qF "$fp" "$f"; then
              echo "::error::$f 里找不到关键内容 '$fp' → 文件被弄混了或版本差太多"
              fail=1
              return
            fi
            case "$(sed -n '2p' "$f")" in
              *"$(basename "$f")"*) echo "  [ok]   $f" ;;
              *) echo "  [note] $f 没有 @id 标记（旧一点但内容对，继续）" ;;
            esac
          }

          check_script scripts/prepare-feeds.sh    'feeds install -p istore'
          check_script scripts/prepare-config.sh   'THIRD-PARTY-BEGIN'
          check_script scripts/verify-config.sh    'diagnose_pkg'
          check_script scripts/collect-firmware.sh 'tar -czf'

          if [ "$fail" -ne 0 ]; then
            echo "::error::scripts/ 里有文件内容不对，用发行包里的 scripts/ 整个覆盖后再跑。"
            exit 1
          fi
          echo "脚本完整性检查通过"

      - name: 参数与环境
        run: |
          set -euo pipefail
          case "$VARIANT" in
            wifi|nowifi) ;;
            *) echo "::error::variant 只能是 wifi 或 nowifi，收到 '$VARIANT'"; exit 1 ;;
          esac
          echo "变体         : $VARIANT"
          echo "第三方插件   : $ENABLE_THIRD_PARTY"
          echo "源码         : ${{ inputs.source_repo }} @ ${{ inputs.source_branch }}"
          echo "机型         : $DEVICES"
          df -h /

      - name: 释放磁盘空间
        run: |
          echo "清理前："
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/az \
                      /usr/local/lib/ruby || true
          sudo docker image prune -a -f || true
          echo "清理后："
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget bc time libelf-dev libtool-bin zip cpio zstd

      - name: 拉取固件源码
        env:
          REPO: ${{ inputs.source_repo }}
          BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            rm -rf "$SOURCE_DIR"
            if git clone --depth 1 --branch "$BRANCH" "$REPO" "$SOURCE_DIR"; then
              break
            fi
            echo "::warning::克隆失败，10 秒后重试（$i/3）"
            sleep 10
          done
          test -d "$SOURCE_DIR/.git"

          cd "$SOURCE_DIR"
          echo "提交     : $(git log -1 --format='%h %ad %s' --date=short)"
          echo "内核版本 : $(grep -m1 'KERNEL_PATCHVER' target/linux/qualcommax/Makefile | tr -d ' ' || echo '未找到')"

      - name: 注入自定义 rootfs 文件（默认 IP 等）
        run: |
          set -euo pipefail
          # overlay/ 会并进 base-files，随基础包进镜像。
          # 为什么放 base-files 而不是 openwrt/files/：base-files 是必装包，
          # 这个路径是 100% 会被打进 rootfs 的，不依赖 buildroot 对 files/ 的处理方式。
          mkdir -p "$SOURCE_DIR/package/base-files/files"
          cp -a overlay/. "$SOURCE_DIR/package/base-files/files/"
          test -f "$SOURCE_DIR/package/base-files/files/etc/uci-defaults/99-custom-lan-ip"
          # overlay 里的脚本要可执行（git 里存的通常是 644）
          for d in usr/bin etc/uci-defaults; do
            if [ -d "$SOURCE_DIR/package/base-files/files/$d" ]; then
              chmod 0755 "$SOURCE_DIR/package/base-files/files/$d"/* 2>/dev/null || true
            fi
          done
          # eMMC 机型才应该带 emmc-health，nand 机型上它只是躺在那儿占几 KB，无害
          echo "已注入："
          find "$SOURCE_DIR/package/base-files/files" -type f -printf '  %p\n'

      - name: 更新并安装 feeds
        working-directory: openwrt
        env:
          EXTRA_FEEDS: ${{ github.workspace }}/config/feeds.extra.conf
        run: |
          set -euo pipefail
          bash ../scripts/prepare-feeds.sh "$EXTRA_FEEDS" "$ENABLE_THIRD_PARTY" "$ENABLE_DOCKER"

      - name: 生成并校验配置
        working-directory: openwrt
        run: |
          set -euo pipefail
          bash ../scripts/prepare-config.sh \
            ../config/base.config \
            "../config/${VARIANT}.config" \
            .config \
            "$ENABLE_THIRD_PARTY" \
            "${{ inputs.extra_packages }}" \
            "$ENABLE_DOCKER" \
            "$DEVICES" \
            "${{ matrix.class }}"

          # OpenWrt 会把 .config 当 makefile include，先自己验一遍：
          # 真有问题时这里就能指名道姓，而不是等 prepare-tmpinfo 报个空变量名
          echo "===== .config 可解析性预检 ====="
          printf 'include .config\ncheck: ;\n' > /tmp/mkcheck.mk
          if ! make -s -f /tmp/mkcheck.mk check; then
            echo "::error::.config 不能被 make 解析，前 5 行（cat -A 显示隐藏字符）："
            head -5 .config | cat -A
            exit 1
          fi
          echo "  预检通过"

          make defconfig
          bash ../scripts/verify-config.sh "$VARIANT" "$ENABLE_THIRD_PARTY" "$STRICT_THIRD_PARTY" "$ENABLE_DOCKER" "${{ matrix.class }}"

          # 额外包（运行时输入 extra_packages）单独再确认一遍：
          # kconfig 对不存在的符号是静默丢弃的，不查就等于没加。
          if [ -n "${{ inputs.extra_packages }}" ]; then
            echo "===== 额外包确认 ====="
            bad=""
            for p in ${{ inputs.extra_packages }}; do
              if grep -qx "CONFIG_PACKAGE_${p}=y" .config; then
                echo "  [OK] $p"
              else
                echo "  [缺失] $p"
                bad="$bad $p"
              fi
            done
            if [ -n "$bad" ]; then
              echo "::error::extra_packages 里的包没进配置：$bad （符号不存在 / 依赖不满足 / 包名写错）"
              exit 1
            fi
          fi

      - name: 预下载源码包
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" download || make -j1 download \
            || echo "::warning::个别源码包下载失败，编译阶段会再次尝试，可忽略"

      - name: 开始编译（约 2~3 小时）
        working-directory: openwrt
        run: |
          # 关键：GitHub 的 run: 默认是 `bash -e -o pipefail`，-e 会让 make 一失败
          # 整个脚本立刻退出 —— 上一版就是因为这个，后面的「抓错误行」全成了死代码，
          # 日志里只剩一句 exit code 2。所以这里第一件事是关掉 -e。
          set -uo pipefail
          set +e
          LOG_DIR="$GITHUB_WORKSPACE/build-logs"
          mkdir -p "$LOG_DIR"

          # 用 tee 而不是 > ：既留文件给 artifact，又让 job 日志本身能看到全部输出
          make -j"$(nproc)" 2>&1 | tee "$LOG_DIR/build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            echo "编译成功（rc=0）"
            exit 0
          fi

          echo "::warning::并行编译失败（rc=$rc），改用单线程重跑以输出完整错误日志"
          make -j1 V=s 2>&1 | tee "$LOG_DIR/build1.log"
          rc=${PIPESTATUS[0]}

          echo "===== 单线程重跑日志最后 80 行 ====="
          tail -80 "$LOG_DIR/build1.log" 2>/dev/null || true

          # 关键行：优先匹配「真正有意义」的错误，再过滤掉 V=s 回显的命令行
          # （回显里常带 echo "ERROR: module ... is missing."，会把真错误挤掉）
          key="$(grep -E "ERROR: info field|ERROR: failed to create package|ERROR: module .* is missing|ERROR: dockerd Expected|ERROR: Expected 'PKG_GIT_SHORT_COMMIT|failed to build|No rule to make target|undefined reference|fatal error:" \
                 "$LOG_DIR/build1.log" 2>/dev/null | grep -v 'echo "' | head -3 || true)"
          if [ -z "$key" ]; then
            key="$(grep -E 'ERROR:|error:|\*\*\* \[' "$LOG_DIR/build1.log" 2>/dev/null | grep -v 'echo "' | head -3 || true)"
          fi
          # 把一堆 /home/runner/work/... 前缀砍掉，annotation 里才看得清
          key="$(printf '%s\n' "$key" | sed "s#${GITHUB_WORKSPACE:-/nonexistent}/##g")"

          {
            echo "## 编译失败（$VARIANT / ${{ matrix.class }}）"
            echo ""
            echo "### 关键错误行"
            echo '```'
            if [ -n "$key" ]; then echo "$key"; else echo "(没匹配到标准错误格式，看下面的尾巴)"; fi
            echo '```'
            echo ""
            echo "### 最后 150 行"
            echo '```'
            tail -150 "$LOG_DIR/build1.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$key" ]; then
            echo "::error::编译失败（详见 Summary）：$(echo "$key" | head -1)"
          else
            echo "::error::编译失败（详见 Summary，或下载 build-log 产物）"
          fi
          exit "$rc"

      - name: 失败时上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.variant }}-${{ matrix.class }}-${{ github.run_number }}
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: 收集固件并校验最终镜像
        run: |
          set -euo pipefail

          bash scripts/collect-firmware.sh "$SOURCE_DIR/$BIN_DIR" "dist/$VARIANT" "$DEVICES"

          # 默认 IP 靠 overlay 里的 uci-defaults，确认它真的进了 rootfs
          if find "$SOURCE_DIR"/build_dir/target-*/root-*/etc/uci-defaults \
                  -name '99-custom-lan-ip' 2>/dev/null | grep -q .; then
            echo "  [OK] 默认 IP 脚本已进 rootfs（192.168.10.254）"
          else
            echo "::warning::rootfs 里没找到 99-custom-lan-ip，刷完可能还是 192.168.1.1"
          fi

          manifests=( "$SOURCE_DIR/$BIN_DIR"/*.manifest )
          if [ ! -f "${manifests[0]}" ]; then
            echo "::error::$SOURCE_DIR/$BIN_DIR 下没有 manifest，编译可能没产物"
            exit 1
          fi
          manifest="${manifests[0]}"
          kernel_line="$(grep -m1 '^kernel ' "$manifest" || true)"

          fatal_pkgs="kmod-qca-nss-drv kmod-qca-nss-ecm kmod-qca-nss-dp luci-app-upnp miniupnpd-nftables
                      kmod-usb-storage kmod-fs-vfat kmod-fs-exfat kmod-fs-ntfs3 block-mount
                      luci-app-nlbwmon"
          extra_pkgs=""
          if [ "$ENABLE_THIRD_PARTY" = "yes" ]; then
            extra_pkgs="luci-app-store luci-lib-taskd taskd luci-app-diskman luci-app-partexp \
                        luci-app-homeproxy sing-box luci-app-autoreboot \
                        luci-app-ddnsto ddnsto luci-app-wechatpush \
                        luci-theme-aurora luci-app-aurora-config gecoosac luci-app-gecoosac"
          fi
          if [ "$ENABLE_DOCKER" = "yes" ]; then
            extra_pkgs="$extra_pkgs luci-app-dockerman luci-lib-docker dockerd containerd runc docker"
          fi

          fatal_missing=""
          warn_missing=""

          check_present() {
            for p in $1; do
              if grep -qE "^${p} " "$manifest"; then
                echo "  [打包成功] $p"
              else
                echo "  [缺失]     $p"
                echo "$p" >> /tmp/missing_$2
              fi
            done
          }

          rm -f /tmp/missing_fatal /tmp/missing_warn
          touch /tmp/missing_fatal /tmp/missing_warn

          check_present "$fatal_pkgs" fatal
          if [ -n "$extra_pkgs" ]; then
            check_present "$extra_pkgs" warn
          fi
          fatal_missing="$(tr '\n' ' ' < /tmp/missing_fatal)"
          warn_missing="$(tr '\n' ' ' < /tmp/missing_warn)"

          # —— 变体一致性：wifi 必须有 ath11k/wpad，nowifi 必须一个都没有 ——
          echo "========== 变体校验（$VARIANT）=========="
          if [ "$VARIANT" = "wifi" ]; then
            for p in kmod-ath11k kmod-ath11k-ahb; do
              if grep -qE "^${p} " "$manifest"; then
                echo "  [OK] $p"
              else
                echo "  [缺失] $p"
                fatal_missing="$fatal_missing $p"
              fi
            done
            if grep -qE '^wpad[a-z0-9-]* ' "$manifest"; then
              echo "  [OK] wpad"
            else
              echo "  [缺失] wpad"
              fatal_missing="$fatal_missing wpad"
            fi
          else
            banned="$(grep -E '^(kmod-ath11k[a-z0-9-]*|wpad[a-z0-9-]*|hostapd[a-z0-9-]*) ' "$manifest" || true)"
            if [ -n "$banned" ]; then
              echo "::error::NOWIFI 镜像里竟然还有无线组件："
              echo "$banned"
              fatal_missing="$fatal_missing 无线组件残留"
            else
              echo "  [OK] 镜像里没有 ath11k / wpad / hostapd"
            fi
          fi

          {
            echo "## 编译结果（$VARIANT）"
            echo ""
            echo "- 源码：\`${{ inputs.source_repo }}@${{ inputs.source_branch }}\`"
            echo "- 提交：\`$(git -C "$SOURCE_DIR" log -1 --format='%h %s')\`"
            echo "- 内核：\`${kernel_line:-未知}\`"
            echo "- 第三方插件：\`$ENABLE_THIRD_PARTY\`"
            echo ""
            echo "### 关键包"
            echo ""
            echo '```'
            pkg_pattern="$(echo $fatal_pkgs $extra_pkgs | tr ' ' '\n' | grep -v '^$' | paste -sd'|' -)"
            grep -E "^(${pkg_pattern}) " "$manifest" || true
            echo '```'
            echo ""
            echo "### 产物"
            echo ""
            echo '```'
            ls -lh "dist/$VARIANT"
            echo '```'
            for dev in $DEVICES; do
              echo ""
              echo "### 机型 ${dev}"
              echo ""
              echo '```'
              cat "dist/$VARIANT/${dev}-files.txt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$warn_missing" ]; then
            echo "::warning::以下第三方插件没进固件：$warn_missing（固件照常输出，可稍后用 opkg/apk 补装）"
          fi
          if [ -n "$fatal_missing" ]; then
            echo "::error::关键包缺失，固件不符合预期：$fatal_missing"
            exit 1
          fi

      - name: 上传工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: ipq6000-${{ inputs.variant }}-${{ matrix.class }}-${{ github.run_number }}
          path: dist/${{ inputs.variant }}/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: ${{ inputs.publish_release == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="ipq6000-$VARIANT-${{ matrix.class }}-$(date -u +%Y%m%d-%H%M)"
          short_sha="$(git -C "$SOURCE_DIR" rev-parse --short HEAD)"
          if [ "$VARIANT" = "wifi" ]; then
            variant_name="WiFi 版（ath11k + NSS 无线卸载）"
          else
            variant_name="NOWIFI 版（不含 ath11k/wpad，开机不会起无线）"
          fi

          cat > "dist/$VARIANT/release-notes.md" <<EOF
          IPQ6000（qualcommax/ipq60xx）+ 满血 NSS 固件 —— $variant_name

          - 源码：${{ inputs.source_repo }}
          - 分支：${{ inputs.source_branch }}（$short_sha）
          - 机型：红米 AX5 / 兆能 ZN-M2 / Link NN6000 v2（均 1G 内存）
          - 插件：miniupnpd(UPnP)、iStore、微信推送、DDNSTO、集客软AC（第三方开关：$ENABLE_THIRD_PARTY）
          - 编译时间（UTC）：$(date -u '+%Y-%m-%d %H:%M')

          刷机前请备份原厂分区，并确认机型与镜像文件名一致。
          EOF

          gh release create "$tag" "dist/$VARIANT"/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes-file "dist/$VARIANT/release-notes.md"
