# 第三方 feed（追加到 openwrt/feeds.conf）
#
# 顺序有意义：feeds install 遇到同名包时用 feeds.conf 里靠前的那个。
# iStore 放最前，并且安装时带 -p istore，确保用的是官方那份。
# enable_thirdparty=no 时整个文件都不会被追加。
# iStore 应用商店 —— 与官方 README 一字不差：
#   echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
#   ./scripts/feeds update istore
#   ./scripts/feeds install -d y -p istore luci-app-store
# （linkease/istore 与 istoreos/istore 是同一个仓库，前者是官方文档里的写法）
src-git istore https://github.com/linkease/istore;main
# DDNSTO（ddnsto / luci-app-ddnsto）+ 通用中文包（luci-lib-taskd、taskd 等）
src-git kenzo https://github.com/kenzok8/openwrt-packages.git;master
# 集客软 AC 控制器（gecoosac 二进制 + luci-app-gecoosac，aarch64 版约 16MB）
src-git gecoo https://github.com/laipeng668/luci-app-gecoosac.git;main
# 微信推送（tty228 版，支持 Server酱 / PushPlus / 企业微信 / Telegram）
src-git wechat https://github.com/tty228/luci-app-wechatpush.git;master
# 那个仓库根目录就是包本体，当 feed 用会让包名变成 feed 名、菜单分类错位，
# 所以由 scripts/prepare-feeds.sh 直接 clone 到 package/luci-theme-aurora。
