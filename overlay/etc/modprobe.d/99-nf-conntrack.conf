# nf_conntrack 的哈希桶大小（模块参数，加载后只读，只能在这里给）。
#
# 65536 个桶 = 约 512KB 内存，对 256MB 的 AX5 也不算负担；换来的好处是
# 26 万条表项不会挤在 16384 个桶里形成长哈希链。
#
# 前提：nf_conntrack 由 modprobe 加载、且 modprobe 会读这个目录。
# 如果模块已经被 firewall 提前加载、或者内核把它编成了内置（=y），
# 这个文件不会生效 —— 那只是少了这层优化，/etc/init.d/conntrack-tune
# 里的 sysctl 调优照常工作。
options nf_conntrack hashsize=65536
